# Super Model website (rules of the served bootstrap image) plus the game under /play/
# (rules of the accepted core-v35 preview, prefixed). Only an unweighted, explicit br
# token selects the precompressed native .br sidecars.
map $http_accept_encoding $sm_brotli_suffix {
    default "";
    ~*(^|,)\s*br\s*(,|$) ".br";
}
map $sm_brotli_suffix $sm_brotli_encoding {
    default "";
    ".br" "br";
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip_static on;
  gzip_vary on;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Website: hashed build assets never change; everything else revalidates.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Game under /play/.
  location = /play/index.html {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location = /play/combat/index.html {
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
  location = /play/party/index.html {
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
  location = /play/assets/combat/runtime.json {
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
  location ~ ^/play/assets/combat/Build/combat-build-v(?:48|49)\.data$ {
    types { }
    default_type application/octet-stream;
    try_files $uri$sm_brotli_suffix =404;
    add_header Content-Encoding $sm_brotli_encoding;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location ~ ^/play/assets/combat/Build/combat-build-v(?:48|49)\.wasm$ {
    types { }
    default_type application/wasm;
    try_files $uri$sm_brotli_suffix =404;
    add_header Content-Encoding $sm_brotli_encoding;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location ~ ^/play/assets/combat/Build/combat-build-v(?:48|49)\.(?:framework|loader)\.js$ {
    types { }
    default_type application/javascript;
    try_files $uri$sm_brotli_suffix =404;
    add_header Content-Encoding $sm_brotli_encoding;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location ~ "^/play/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|svg)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
  location /play/assets/ {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
  location /play/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /play/index.html;
  }
}
